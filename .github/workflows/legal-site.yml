# Pages publiques exigées par les stores (assistance, confidentialité, suppression de compte), générées depuis
# i18n/locales/*/legal.json et publiées sur https://skyblob12.github.io/WorkFloor/.
# Prérequis unique : Settings → Pages → Source « GitHub Actions ».
name: Pages légales

on:
  push:
    branches: ['main']
    paths:
      - 'i18n/locales/*/legal.json'
      - 'i18n/locales.ts'
      - 'constants/app.ts'
      - 'constants/legal.ts'
      - 'constants/tokens.json'
      - 'scripts/build-legal-site.mjs'
      - '.github/workflows/legal-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/build-legal-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-legal

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
