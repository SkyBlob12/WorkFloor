# Build + soumission App Store / Play Store quand un tag de version est poussé (ex. git tag v1.0.0).
# Lancement manuel possible : npx eas-cli workflow:run .eas/workflows/release-stores.yml
name: Release stores

on:
  push:
    tags: ['v*']

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Soumission Play Store
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  submit_ios:
    name: Soumission App Store
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
