# À chaque push sur main : correctif JS OTA sur les apps installées.
# EAS Update ne touche que les apps ayant la même runtimeVersion (= même version de l'app).
# Pas de déploiement web : seule la version mobile est publiée pour l'instant.
name: Main

on:
  push:
    branches: ['main']

jobs:
  update_apps:
    name: EAS Update (production)
    type: update
    environment: production
    params:
      channel: production
